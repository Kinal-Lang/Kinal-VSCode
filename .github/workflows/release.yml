name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to create or update, for example v0.2.10"
        required: true
        type: string
      release_name:
        description: "Optional release title"
        required: false
        type: string
      prerelease:
        description: "Publish as prerelease"
        required: false
        default: false
        type: boolean
      allow_retag:
        description: "Allow overwriting an existing tag"
        required: false
        default: false
        type: boolean
      release_notes:
        description: "Optional markdown release notes body"
        required: false
        type: string

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Check tag state
        env:
          TAG_NAME: ${{ inputs.tag }}
          ALLOW_RETAG: ${{ inputs.allow_retag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG_NAME" >/dev/null 2>&1; then
            if [ "$ALLOW_RETAG" = "true" ]; then
              echo "Tag $TAG_NAME already exists and will be replaced."
              echo "TAG_EXISTS=true" >> "$GITHUB_ENV"
            else
              echo "Tag $TAG_NAME already exists. Refusing to overwrite."
              exit 1
            fi
          else
            echo "TAG_EXISTS=false" >> "$GITHUB_ENV"
          fi

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create tag
        if: env.TAG_EXISTS == 'false'
        env:
          TAG_NAME: ${{ inputs.tag }}
        run: |
          git tag "$TAG_NAME"
          git push origin "$TAG_NAME"

      - name: Force retag
        if: env.TAG_EXISTS == 'true'
        env:
          TAG_NAME: ${{ inputs.tag }}
        run: |
          git tag -f "$TAG_NAME"
          git push origin "$TAG_NAME" --force

      - name: Build VSIX
        run: python build.py package --clean

      - name: Smoke test
        run: python build.py test

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v5
        with:
          name: kinal-vscode-vsix-${{ inputs.tag }}
          path: |
            dist/*.vsix
            dist/SHA256SUMS-*.txt
          if-no-files-found: error

      - name: Write release notes
        shell: bash
        run: |
          cat > release-notes.md <<'EOF'
          ${{ inputs.release_notes }}
          EOF

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ inputs.tag }}
          RELEASE_NAME: ${{ inputs.release_name != '' && inputs.release_name || inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        shell: bash
        run: |
          EXTRA_FLAGS=()
          if [ "$PRERELEASE" = "true" ]; then
            EXTRA_FLAGS+=(--prerelease)
          fi

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" \
              --title "$RELEASE_NAME" \
              --notes-file release-notes.md \
              "${EXTRA_FLAGS[@]}"
            gh release upload "$TAG_NAME" dist/*.vsix dist/SHA256SUMS-*.txt --clobber
          else
            gh release create "$TAG_NAME" \
              --title "$RELEASE_NAME" \
              --notes-file release-notes.md \
              "${EXTRA_FLAGS[@]}" \
              dist/*.vsix dist/SHA256SUMS-*.txt
          fi


name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to create or update, for example v0.2.10"
        required: true
        type: string
      release_name:
        description: "Optional release title"
        required: false
        type: string
      prerelease:
        description: "Publish as prerelease"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create or update tag
        env:
          TAG_NAME: ${{ inputs.tag }}
        run: |
          git tag -f "$TAG_NAME"
          git push origin "$TAG_NAME" --force

      - name: Build VSIX
        run: python build.py package --clean

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: kinal-vscode-vsix-${{ inputs.tag }}
          path: dist/*.vsix
          if-no-files-found: error

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.release_name != '' && inputs.release_name || inputs.tag }}
          prerelease: ${{ inputs.prerelease }}
          files: dist/*.vsix

name: Version Set

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Exact version in x.y.z format"
        required: true
        type: string

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  version-set:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Set version
        shell: bash
        run: |
          python build.py version set "${{ inputs.version }}"
          echo "VERSION=$(python build.py version get)" >> "$GITHUB_ENV"

      - name: Commit and push
        shell: bash
        run: |
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No version changes to commit."
          else
            git commit -m "Set VSCode extension version to $VERSION"
            git push origin HEAD:main
          fi

      - name: Write summary
        shell: bash
        run: |
          {
            echo "## Version updated"
            echo
            echo "\`$VERSION\`"
          } >> "$GITHUB_STEP_SUMMARY"


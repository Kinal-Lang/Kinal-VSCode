name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: python build.py deps

      - name: Compile extension
        run: python build.py compile

      - name: Package VSIX
        run: python build.py package

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: kinal-vscode-vsix
          path: dist/*.vsix
          if-no-files-found: error

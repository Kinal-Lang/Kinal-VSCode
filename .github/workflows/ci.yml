name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: python build.py deps

      - name: Compile extension
        run: python build.py compile

      - name: Smoke test
        run: python build.py test

      - name: Package VSIX
        run: python build.py package

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v5
        with:
          name: kinal-vscode-vsix
          path: |
            dist/*.vsix
            dist/SHA256SUMS-*.txt
          if-no-files-found: error


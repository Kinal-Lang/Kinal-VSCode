name: Publish VSCode Marketplace

on:
  release:
    types: [published]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  publish:
    name: Publish extension
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      - name: Build VSIX
        run: python build.py package --clean

      - name: Check package version matches release tag
        shell: bash
        run: |
          PKG_VERSION="$(python build.py version get)"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "package.json version ($PKG_VERSION) does not match release tag (${GITHUB_REF_NAME})."
            exit 1
          fi

      - name: Publish to Visual Studio Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        shell: bash
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "Missing VSCE_PAT repository secret."
            exit 1
          fi
          VSIX="$(find dist -maxdepth 1 -name '*.vsix' -print -quit)"
          if [ -z "$VSIX" ]; then
            echo "No VSIX package found under dist/."
            exit 1
          fi
          npx --yes @vscode/vsce publish --packagePath "$VSIX" --pat "$VSCE_PAT"
